<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eee5c9">
<meta name="robots" content="noindex">
<title>필카톡 · 관리자 페이지</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="shell admin-shell">
  <div class="topline"><div class="brand"><span class="mark">필</span><span>FILM PHOTO CLUB&nbsp; / &nbsp;ADMIN</span></div><a class="ghost" href="/">← 사진 페이지</a></div>
  <header class="hero"><div><div class="kicker">필름사진카톡 · 관리자 페이지</div><h1>계절의 기록,<br><span>SEASONAL ARCHIVE.</span></h1></div><div class="hero-note"><b>SEASONAL PHOTO ARCHIVE</b>계절별 순위와 전체 사진을 확인하고, 달력에 담을 사진을 북마크해 두세요.</div></header>
  <section class="gate" id="gate" hidden><form id="gateForm"><label for="keyInput">ADMIN KEY</label><input id="keyInput" type="password" autocomplete="off" placeholder="관리자 키 코드"><button class="add-btn" type="submit">입장</button></form></section>
  <section id="board" hidden>
    <nav class="season-switcher" id="seasonSwitcher" aria-label="계절 선택">
      <button class="season-button active" type="button" data-season="all" aria-pressed="true" hidden>전체 북마크 <small>ALL SAVED</small></button>
      <button class="season-button active" type="button" data-season="spring" aria-pressed="true">봄 <small>SPRING</small></button>
      <button class="season-button" type="button" data-season="summer" aria-pressed="false">여름 <small>SUMMER</small></button>
      <button class="season-button" type="button" data-season="autumn" aria-pressed="false">가을 <small>AUTUMN</small></button>
      <button class="season-button" type="button" data-season="winter" aria-pressed="false">겨울 <small>WINTER</small></button>
    </nav>
    <div class="toolbar"><div class="admin-tabs" role="group" aria-label="보기 선택"><button class="ghost on" data-view="ranking" type="button">계절별 순위</button><button class="ghost" data-view="all" type="button">계절별 전체 사진</button><button class="ghost" data-view="bookmarks" type="button">북마크 모아보기 <span id="bookmarkCount"></span></button><button class="ghost" data-view="uploaders" type="button">유저별 업로드 수</button></div><button class="ghost" id="reload" type="button">새로고침</button><button class="ghost" id="logout" type="button">나가기</button></div>
    <div id="content" class="admin-content" aria-live="polite"></div>
  </section>
  <div class="bottomnote">원본 저장은 업로드된 이미지 파일을 그대로 내려받습니다. 북마크는 관리자 계정 데이터베이스에 저장되어 다시 접속해도 유지됩니다.</div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="viewer"><img id="big" alt=""></dialog>
<script>
const $=(s)=>document.querySelector(s);
let key=sessionStorage.getItem('adminKey')||'', seasons=[], currentSeason='spring', bookmarkSeason='all', currentView='ranking', bookmarkIds=new Set(), toastTimer;
const SEASONS={spring:{name:'봄',english:'SPRING'},summer:{name:'여름',english:'SUMMER'},autumn:{name:'가을',english:'AUTUMN'},winter:{name:'겨울',english:'WINTER'}};
const seasonName=(s)=>SEASONS[s]?.name||s;
const say=(t)=>{const e=$('#toast');e.textContent=t||'';e.classList.toggle('show',!!t);clearTimeout(toastTimer);if(t)toastTimer=setTimeout(()=>e.classList.remove('show'),2800)};
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'X-Admin-Key':key,...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401)throw new Error('auth');if(!r.ok)throw new Error(d.error||'요청을 처리하지 못했어요.');return d}
async function enter(candidate,silent=false){key=candidate;try{const d=await api('/api/admin/ranking');seasons=d.seasons||[];sessionStorage.setItem('adminKey',key);$('#gate').hidden=true;$('#board').hidden=false;await loadBookmarks();await draw()}catch(e){$('#board').hidden=true;$('#gate').hidden=false;if(e.message==='auth'){key='';sessionStorage.removeItem('adminKey');if(!silent)say('관리자 키가 올바르지 않아요.')}else say(e.message)}}
async function loadBookmarks(){const d=await api('/api/admin/bookmarks');bookmarkIds=new Set(d.photos.map(p=>p.id));$('#bookmarkCount').textContent=bookmarkIds.size?`· ${bookmarkIds.size}`:''}
function monthTitle(m){return m?`${seasonName(m)} · ${SEASONS[m]?.english||''}`:'전체 북마크'}
function syncSeasonButtons(){const nav=$('#seasonSwitcher');nav.hidden=currentView==='uploaders';nav.classList.toggle('bookmark-mode',currentView==='bookmarks');for(const b of nav.querySelectorAll('[data-season]')){const isAll=b.dataset.season==='all';b.hidden=isAll?currentView!=='bookmarks':false;const active=currentView==='bookmarks'?bookmarkSeason===b.dataset.season:currentSeason===b.dataset.season;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))}}
function createPhotoCard(p){const card=document.createElement('article');card.className='admin-photo';const img=document.createElement('img');img.src=p.thumb;img.loading='lazy';img.alt=`${p.nickname}님의 사진`;img.onclick=()=>{$('#big').src=p.url;$('#viewer').showModal()};const body=document.createElement('div');body.className='admin-photo-meta';const title=document.createElement('strong');title.textContent=p.nickname;const meta=document.createElement('small');meta.textContent=`${p.votes}표 · ${seasonName(p.season)}`;const actions=document.createElement('div');actions.className='admin-photo-actions';const dl=document.createElement('button');dl.type='button';dl.className='ghost';dl.textContent='원본 다운로드';dl.onclick=()=>downloadPhoto(p,dl);const bm=document.createElement('button');bm.type='button';bm.className='ghost'+(bookmarkIds.has(p.id)?' on':'');bm.textContent=bookmarkIds.has(p.id)?'★ 북마크됨':'☆ 북마크';bm.onclick=()=>toggleBookmark(p,bm);actions.append(dl,bm);body.append(title,meta,actions);card.append(img,body);return card}
async function downloadPhoto(p,button){button.disabled=true;try{const r=await fetch(`/api/admin/photos/${p.id}/download`,{headers:{'X-Admin-Key':key}});if(!r.ok)throw new Error('원본을 내려받지 못했어요.');const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`filcatalk_${p.id}`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){say(e.message)}finally{button.disabled=false}}
async function toggleBookmark(p,button){button.disabled=true;try{if(bookmarkIds.has(p.id))await api(`/api/admin/bookmarks/${p.id}`,{method:'DELETE'});else await api('/api/admin/bookmarks',{method:'POST',body:JSON.stringify({photoId:p.id})});await loadBookmarks();button.classList.toggle('on',bookmarkIds.has(p.id));button.textContent=bookmarkIds.has(p.id)?'★ 북마크됨':'☆ 북마크';if(currentView==='bookmarks')await draw()}catch(e){say(e.message)}finally{button.disabled=false}}
function gallery(photos){const grid=document.createElement('div');grid.className='admin-gallery';if(!photos.length){const p=document.createElement('p');p.className='novote';p.textContent='해당 사진이 없습니다.';grid.append(p);return grid}photos.forEach(p=>grid.append(createPhotoCard(p)));return grid}
function uploaderTable(uploaders){const wrap=document.createElement('div');wrap.className='uploader-table-wrap';const table=document.createElement('table');table.className='uploader-table';const thead=document.createElement('thead'),hr=document.createElement('tr');['닉네임','전체','봄','여름','가을','겨울'].forEach(label=>{const th=document.createElement('th');th.textContent=label;hr.append(th)});thead.append(hr);table.append(thead);const tbody=document.createElement('tbody');for(const u of uploaders){const tr=document.createElement('tr');[u.nickname,u.total,u.spring,u.summer,u.autumn,u.winter].forEach((value,i)=>{const td=document.createElement('td');td.textContent=String(value??0);if(i===0)td.className='uploader-name';tr.append(td)});tbody.append(tr)}if(!uploaders.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=6;td.textContent='아직 업로드한 사진이 없습니다.';tr.append(td);tbody.append(tr)}table.append(tbody);wrap.append(table);return wrap}
async function draw(){const content=$('#content');content.replaceChildren();try{if(currentView==='bookmarks'){const d=await api('/api/admin/bookmarks');const photos=bookmarkSeason==='all'?d.photos:d.photos.filter(p=>p.season===bookmarkSeason);const title=bookmarkSeason==='all'?'전체 북마크':`${seasonName(bookmarkSeason)} 북마크`;content.append(sectionTitle(title,`${photos.length}장`),gallery(photos));return}if(currentView==='uploaders'){const d=await api('/api/admin/uploaders');const total=d.uploaders.reduce((sum,u)=>sum+Number(u.total||0),0);content.append(sectionTitle('유저별 업로드 수',`${d.uploaders.length}명 · ${total}장`),uploaderTable(d.uploaders));return}const season=currentSeason;const data=seasons.find(s=>s.season===season);if(currentView==='ranking'){content.append(sectionTitle(monthTitle(season),`${data?.total||0}장`));if(!data?.ranks.length){const p=document.createElement('p');p.className='novote';p.textContent='아직 투표가 없어요.';content.append(p);return}for(const rank of data.ranks){const section=document.createElement('section');section.className='mcard';const head=sectionTitle(`${rank.rank}위`,`${rank.votes}표${rank.photos.length>1?` · 공동 ${rank.photos.length}장`:''}`);section.append(head,gallery(rank.photos));content.append(section)}return}const d=await api(`/api/admin/photos?season=${encodeURIComponent(season)}`);content.append(sectionTitle(monthTitle(season),`${d.photos.length}장`),gallery(d.photos))}catch(e){if(e.message==='auth'){key='';sessionStorage.removeItem('adminKey');$('#board').hidden=true;$('#gate').hidden=false}else say(e.message)}}
function sectionTitle(title,meta){const h=document.createElement('div');h.className='admin-section-title';const t=document.createElement('h2');t.textContent=title;const s=document.createElement('small');s.textContent=meta||'';h.append(t,s);return h}
document.querySelectorAll('[data-season]').forEach(b=>b.onclick=()=>{if(currentView==='bookmarks')bookmarkSeason=b.dataset.season;else currentSeason=b.dataset.season;syncSeasonButtons();draw()});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{currentView=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x===b));syncSeasonButtons();draw()});
$('#reload').onclick=()=>enter(key,true).then(()=>say('새로고침했어요.'));$('#logout').onclick=()=>{key='';sessionStorage.removeItem('adminKey');$('#board').hidden=true;$('#gate').hidden=false;$('#keyInput').value=''};$('#gateForm').onsubmit=e=>{e.preventDefault();if($('#keyInput').value)enter($('#keyInput').value)};$('#viewer').onclick=()=>$('#viewer').close();if(key)enter(key,true);else $('#gate').hidden=false;
</script>
</body>
</html>
